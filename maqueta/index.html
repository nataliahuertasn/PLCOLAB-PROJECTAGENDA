<div class="app">
  <nav class="tabs"><div class="tab">Invoices Archive</div></nav>

  <main class="panel">
    <h1>INVOICES ARCHIVE</h1>

    <div class="toolbar">
      <div class="date-filter">
        <svg class="icon"><use href="#i-calendar"/></svg>
        <button class="outlined" id="dateField" type="button" aria-haspopup="dialog" aria-expanded="false">
          <span class="legend">Date Range (Max 3 months)</span>
          <span id="dateLabel">—</span>
        </button>
        <div class="date-popover" id="datePopover" hidden role="dialog" aria-label="Seleccionar rango de fechas">
          <div class="row">
            <label>Fecha inicial<input type="date" id="dateStart"></label>
            <label>Fecha final<input type="date" id="dateEnd"></label>
          </div>
          <div class="presets">
            <button class="chip-btn" data-preset="month" type="button">Mes actual</button>
            <button class="chip-btn" data-preset="30" type="button">Últimos 30 días</button>
            <button class="chip-btn" data-preset="90" type="button">Últimos 3 meses</button>
          </div>
          <div class="hint" id="dateHint">Filtra por fecha de emisión (Issue Date).</div>
          <div class="actions">
            <button class="btn btn-text" id="dateCancel" type="button">Cancelar</button>
            <button class="btn btn-text" id="dateApply" type="button">Aplicar</button>
          </div>
        </div>
      </div>

      <div class="spacer"></div>

      <button class="btn btn-outline" id="btnCross" type="button" title="Reconcile PL Colab invoices against Project Agenda">
        <svg class="icon"><use href="#i-compare"/></svg>Reconcile
      </button>
      <button class="btn btn-primary" id="btnReport" type="button">
        <svg class="icon"><use href="#i-report"/></svg>Report
      </button>
    </div>


    <section class="table-card">
      <div class="table-scroll" id="tableScroll">
        <table class="grid" id="mainTable">
          <colgroup>
            <col class="c-type"><col class="c-sup"><col class="c-id"><col class="c-iss"><col class="c-due">
            <col class="c-amt"><col class="c-oc"><col class="c-sap"><col class="c-acc"><col class="c-cross" id="colCross"><col class="c-act">
          </colgroup>
          <thead><tr id="headRow"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty-state" id="emptyState" hidden>No hay facturas para el rango y filtros seleccionados.</div>
      </div>
      <div class="table-footer">
        <span id="rowCount"></span>
        <button class="btn btn-text" id="clearFilters" type="button" hidden>
          <svg class="icon sm"><use href="#i-filter-off"/></svg>Limpiar filtros
        </button>
        <span class="spacer"></span>
        <span id="sourceNote"></span>
      </div>
    </section>
  </main>
</div>

<!-- Menú de acciones por fila -->
<div class="menu" id="rowMenu" hidden role="menu"></div>

<!-- Modal: cruce (carga / configuración / procesamiento) -->
<div class="backdrop" id="crossBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="crossTitle" id="crossModal">
    <div class="modal-header">
      <svg class="icon lg" style="color:var(--primary)"><use href="#i-compare"/></svg>
      <div>
        <h2 id="crossTitle">Reconcile</h2>
        <div class="sub">PL Colab vs. Project Agenda</div>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" data-close="cross" aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div class="modal-body" id="crossBody"></div>
    <div class="modal-footer" id="crossFooter"></div>
  </div>
</div>

<!-- Modal: resultado del cruce (PL Colab & Project Agenda Invoice Reconciliation) -->
<div class="backdrop" id="resultBackdrop" hidden>
  <div class="modal rec-modal" role="dialog" aria-modal="true" aria-labelledby="recTitle">
    <div class="rec-header">
      <button class="rec-close" data-close="result" aria-label="Close" title="Close"><svg class="icon"><use href="#i-close"/></svg></button>
      <h2 id="recTitle">PL Colab &amp; Project Agenda Invoice Reconciliation</h2>
      <span class="spacer"></span>
      <button class="btn btn-primary" id="recExport" type="button"><svg class="icon sm"><use href="#i-download"/></svg>Export to Excel</button>
    </div>
    <div class="rec-counts" id="recCounts"></div>
    <div class="rec-list-title" id="recListTitle"></div>
    <div class="rec-table-wrap">
      <table class="rec-table">
        <thead><tr><th>Consecutive</th><th>Supplier</th><th>Issue Date</th></tr></thead>
        <tbody id="recTbody"></tbody>
      </table>
    </div>
  </div>
</div>


<div class="toast" id="toast" hidden role="status"></div>

<script src="lib/xlsx.full.min.js"></script>
<script>
  // Respaldo: si la librería local no cargó, usar CDN.
  if (!window.XLSX) document.write('<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"><\/script>');
</script>
<script src="js/data-software.js"></script>
<script src="js/crossmatch.js"></script>
<script src="js/app.js"></script>
<script src="js/cross-ui.js"></script>
</body>
</html>
